<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Você está offline — Finanças Pessoais</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f8fa;
        color: #101418;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 360px; }
      .icon {
        width: 56px;
        height: 56px;
        border-radius: 9999px;
        background: #0b3b4c;
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 24px;
      }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { font-size: 14px; color: #4a5560; line-height: 1.5; margin: 0; }
      button {
        margin-top: 20px;
        background: #0b3b4c;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">⚡</div>
      <h1>Sem conexão com a internet</h1>
      <p>
        Este aplicativo depende de conexão com o Supabase para carregar e salvar seus dados
        financeiros. Assim que a conexão voltar, tente novamente.
      </p>
      <button onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
